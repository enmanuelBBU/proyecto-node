<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CraftBuild</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Three.js Canvas -->
  <div id="three-container"></div>

  <!-- Block Labels -->
  <div id="label-crafteos" class="block-label">Crafteos</div>
  <div id="label-construcciones" class="block-label">Construcciones</div>
  <div id="label-perfil" class="block-label">Perfil</div>

  <!-- Title Banner -->
  <div id="title-banner">
    <h1>CraftBuild</h1>
    <span id="hud-status" class="hud-dot ok"></span>
  </div>

  <!-- Hint -->
  <div id="hint-text">Click en un bloque para explorar</div>

  <!-- User Chip -->
  <div id="user-chip">
    <span class="chip-avatar">👤</span>
    <span class="chip-name"></span>
  </div>

  <!-- ==================== LOGIN ==================== -->
  <div id="login-overlay">
    <div class="login-card">
      <h2>CraftBuild</h2>
      <p class="login-sub">Selecciona como quieres ingresar</p>

      <div class="login-options">
        <button id="login-opt-existing" class="login-opt-btn active">Usuario Registrado</button>
        <button id="login-opt-new" class="login-opt-btn">Usuario Nuevo</button>
      </div>

      <!-- Login form (email + password) -->
      <div id="login-section-existing" class="login-section active">
        <div class="mc-fld"><label>Email o Nombre</label><input id="login-email" class="mc-input" placeholder="steve@craftbuild.mc o Steve" type="text"></div>
        <div class="mc-fld"><label>Contrasena</label><input id="login-password" class="mc-input" placeholder="******" type="password"></div>
        <button id="login-do-login" class="mc-btn green wide" style="margin-top:6px">Iniciar Sesion</button>
        <div id="login-error" class="mc-result" style="margin-top:4px"></div>
      </div>

      <!-- Register form -->
      <div id="login-section-new" class="login-section">
        <div class="mc-fld"><label>Nombre</label><input id="reg-nombre" class="mc-input" placeholder="Steve"></div>
        <div class="mc-fld"><label>Email</label><input id="reg-email" class="mc-input" placeholder="steve@craftbuild.mc" type="email"></div>
        <div class="mc-fld"><label>Contrasena</label><input id="reg-password" class="mc-input" placeholder="Min. 6 caracteres" type="password"></div>
        <button id="login-do-register" class="mc-btn green wide" style="margin-top:6px">Registrarse</button>
      </div>
    </div>
  </div>

  <!-- ==================== PANEL ==================== -->
  <div id="panel-overlay" class="hidden">
    <div id="panel">
      <button id="panel-close" class="panel-close-btn">X</button>
      <div id="panel-header">
        <h2 id="panel-title"></h2>
        <span id="panel-badge">0</span>
      </div>
      <div id="panel-content"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Three.js -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
